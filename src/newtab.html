<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/newtab.css">
</head>
<body class="newtab-body">
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-tint"></div>
  <div class="player-name" id="playerName"></div>
  <button type="button" class="sound-hint" id="soundHint" hidden data-i18n="wallpaper.clickForSound">点击恢复声音</button>

  <main class="menu-stage">
    <div class="menu-inner">
      <img class="game-logo" data-tex="title" src="assets/title.png" alt="MINECRAFT">

      <div class="menu-actions">
        <div class="action-stack" id="actionStack">
          <button type="button" class="mc-button main-button" id="btnSearch" data-i18n="menu.search">搜索</button>
          <button type="button" class="mc-button main-button" id="btnSettings" data-i18n="menu.settings">设置</button>
          <button type="button" class="mc-button main-button" id="btnWidgets" data-i18n="menu.widgets">小组件</button>
        </div>

        <div class="search-panel" id="searchPanel" hidden>
          <div class="search-panel-head" data-i18n="search.title">按关键词查找网页</div>
          <div class="search-panel-body">
            <input type="text" class="mc-input search-field" id="searchField"
                   autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder">
            <div class="search-hintrow">
              <span data-i18n="search.hint">按 Enter 开始搜索</span>
              <span class="search-provider" id="searchProvider"></span>
            </div>

            <div class="search-matches" id="searchMatches" hidden>
              <div class="history-head">
                <span class="history-title" data-i18n="search.matches">匹配的小组件</span>
              </div>
              <ul class="match-list" id="matchList"></ul>
            </div>

            <div class="history-head">
              <span class="history-title" data-i18n="search.history">搜索历史</span>
              <button type="button" class="history-clear" id="btnClearHistory">
                <img class="mc-icon" data-tex="icon_trash" src="assets/vanilla/icon_trash.png" alt="">
                <span data-i18n="search.clear">清空历史</span>
              </button>
            </div>
            <div class="history-scroll-area">
              <ul class="history-list" id="historyList"></ul>
              <div class="history-scrollbar" id="historyScrollbar" hidden>
                <div class="history-scroll-thumb" id="historyScrollThumb"></div>
              </div>
            </div>
            <p class="history-empty" id="historyEmpty" data-i18n="search.empty">暂无搜索历史</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= 物品栏 / 小组件面板 ================= -->
  <div class="inventory-overlay" id="inventoryOverlay" hidden>
    <section class="inventory-shell" id="inventoryShell" role="dialog" aria-modal="true" aria-label="Widgets">
      <div class="inventory-top">
        <button type="button" class="tab-page is-prev" id="tabPrev" hidden aria-label="Previous category page">
          <img data-tex="arrow_left" src="assets/vanilla/arrow_left.png" alt="">
        </button>
        <div class="tab-strip" id="tabStrip"></div>
        <button type="button" class="tab-page is-next" id="tabNext" hidden aria-label="Next category page">
          <img data-tex="arrow_left" src="assets/vanilla/arrow_left.png" alt="">
        </button>
        <button type="button" class="tab-add" id="btnNewCategory" aria-label="New category">
          <img data-tex="icon_plus_dark" src="assets/vanilla/icon_plus_dark.png" alt="">
        </button>
        <div class="inventory-tools">
          <div class="inventory-search">
            <img class="inventory-search-icon" data-tex="magnify" src="assets/vanilla/magnify.png" alt="">
            <input type="text" id="inventorySearch" class="inventory-search-input"
                   autocomplete="off" spellcheck="false" data-i18n-placeholder="inventory.searchPlaceholder">
          </div>
          <button type="button" class="inventory-close" id="btnInventoryClose" aria-label="Close">
            <img data-tex="close_x_light" src="assets/vanilla/close_x_light.png" alt="">
          </button>
        </div>
      </div>

      <div class="inventory-window" id="inventoryWindow">
        <div class="inventory-window-head">
          <span class="drag-hint" data-i18n="inventory.dragHint">将图标拖出面板即可删除</span>
          <span class="category-label" id="inventoryCategoryLabel"></span>
        </div>
        <div class="grid-area">
          <div class="item-grid" id="inventoryGrid"></div>
          <div class="grid-scrollbar" id="gridScrollbar" hidden>
            <div class="grid-scroll-thumb" id="gridScrollThumb"></div>
          </div>
        </div>
      </div>

      <div class="hotbar-wrap">
        <div class="hotbar" id="hotbar" data-i18n-title="inventory.hotbar"></div>
      </div>
    </section>
  </div>

  <div class="slot-tooltip" id="slotTooltip" hidden></div>

  <div class="modal-backdrop" id="modalRoot" hidden></div>
  <div class="mc-toast" id="toast"></div>

  <script src="js/packs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
